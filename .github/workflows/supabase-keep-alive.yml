name: Supabase Keep Alive

on:
  schedule:
    # 3日ごとの午前0時(UTC)に実行
    # ※GitHub Actionsのスケジュールは遅延することがありますが、数日おきの実行であれば問題ありません。
    - cron: '0 0 */3 * *'
  workflow_dispatch: # GitHub UIから手動で実行できるようにする

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/items?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
